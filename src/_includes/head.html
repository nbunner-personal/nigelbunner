<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title | default: site.title }}</title>
  {%- if description %}
  <meta name="description" content="{{ description }}">
  {%- elsif title %}
  <meta name="description" content="{{ title }} - {{ site.description }}">
  {%- endif %}

  {%- if thumb %}
  <meta property="og:image" content="{{ site.url }}/img/posts/{{ thumb }}">
  <meta name="twitter:image" content="{{ site.url }}/img/posts/{{ thumb }}">
  {%- endif %}
  <meta property="og:title" content="{{ title | default: site.title }}">
  <meta name="twitter:title" content="{% if title %}{{ title }} - {% endif %}{{ site.title }}">
  <meta property="og:description" content="{% if description %}{{ description }} - {% endif %}{{ site.description }}">
  <meta name="twitter:description" content="{% if description %}{{ description }} - {% endif %}{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta name="twitter:url" content="{{ site.url }}{{ page.url }}">
  <meta name="twitter:site" content="@{{ site.twitter_username }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Alegreya|Source+Sans+Pro&display=swap">
  <link rel="stylesheet" href="/css/nb-styles.css">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f6f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12171a" media="(prefers-color-scheme: dark)">
  <script>
    // Apply a theme chosen with the footer toggle (see _theme.scss).
    // Runs here, before the body renders, so there's no flash of the wrong theme.
    window.nbSetTheme = function (theme) {
      document.documentElement.setAttribute("data-theme", theme);
      var colour = theme === "dark" ? "#12171a" : "#f3f6f7";
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", colour);
    };
    (function () {
      var saved;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved === "dark" || saved === "light") window.nbSetTheme(saved);
    })();
  </script>
</head>

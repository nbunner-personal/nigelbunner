<article class="post">
  <header class="article-header">
    <h2><a class="post-link" href="{{ post.url }}">{{ post.data.title }}</a></h2>
  </header>
  <div class="post-meta-top">
    <div class="date">
      <span>
        <strong><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time> | </strong>
        {%- if site.reading_time %}
        <span class="entry-reading-time">
          {% include "reading-time-icon.svg" %}
          <span class="reading-time" title="Estimated read time">{{ post.content | readingTime }}</span>
        </span>
        {%- endif %}
      </span>
    </div>
  </div>
  <p>{{ post.content | strip_html | truncatewords: 75 }} <a class="post-link" href="{{ post.url }}">Read more</a></p>
</article>
